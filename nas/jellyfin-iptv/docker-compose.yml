services:

  tunnel-tigres:
    image: ginuerzh/gost:latest
    container_name: tunnel-tigres
    restart: unless-stopped
    command: >-
      -L=tcp://:2087/mainhost.123tigres.org:2087
      -F=http://${PROXY_USER}:${PROXY_PASS}@${PROXY_HOST}:${PROXY_PORT}
    extra_hosts:
      - "mainhost.123tigres.org:127.0.0.1"


  # ==========================================
  # GENERADOR: XTREAM 2 JELLYFIN (.strm & .nfo)
  # ==========================================
  xtream2jellyfin:
    image: ghcr.io/mishka81/xtream2jellyfin:latest
    container_name: xtream2jellyfin
    restart: unless-stopped
    depends_on:
      - tunnel-tigres
    network_mode: "service:tunnel-tigres"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${APPDATA_PATH}/jellyfin-iptv/xtream2jellyfin/config:/app/config
      - ${APPDATA_PATH}/jellyfin-iptv/xtream2jellyfin/cache:/app/cache
      - ${APPDATA_PATH}/jellyfin-iptv/xtream2jellyfin/media:/app/media


  # ==========================================
  # SERVIDOR: JELLYFIN
  # ==========================================
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    depends_on:
      - xtream2jellyfin
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - HTTP_PROXY=${PROXY_URL}
      - HTTPS_PROXY=${PROXY_URL}
      - NO_PROXY=localhost,127.0.0.1,192.168.1.0/24,bearslions.com
    ports:
      - "8096:8096"
    volumes:
      - ${APPDATA_PATH}/jellyfin-iptv/jellyfin/config:/config
      - ${APPDATA_PATH}/jellyfin-iptv/jellyfin/cache:/cache
      # Mapeos directos e independientes por biblioteca
      - ${APPDATA_PATH}/jellyfin-iptv/xtream2jellyfin/media/tigresTV/movies:/media/movies:ro
      - ${APPDATA_PATH}/jellyfin-iptv/xtream2jellyfin/media/tigresTV/series:/media/series:ro
    tmpfs:
      - /transcode:size=2G,uid=${PUID},gid=${PGID}
    devices:
      - /dev/dri:/dev/dri