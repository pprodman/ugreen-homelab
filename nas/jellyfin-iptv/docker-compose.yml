services:
  # ==========================================
  # TÚNEL VPN: GLUETUN (SURFSHARK WIREGUARD)
  # ==========================================
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=surfshark
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=10.14.0.2/16
      - SERVER_COUNTRIES=${VPN_COUNTRIES}
      - FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24
      - TZ=${TZ}
    volumes:
      - ${APPDATA_PATH}/jellyfin-iptv/gluetun:/gluetun

  # ==========================================
  # GENERADOR: XTREAM 2 JELLYFIN (.strm & .nfo)
  # ==========================================
  xtream2jellyfin:
    image: ghcr.io/mishka81/xtream2jellyfin:latest
    container_name: xtream2jellyfin
    restart: unless-stopped
    depends_on:
      gluetun:
        condition: service_healthy
    network_mode: "service:gluetun"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${APPDATA_PATH}/jellyfin-iptv/xtream2jellyfin/config:/app/config
      - ${APPDATA_PATH}/jellyfin-iptv/xtream2jellyfin/cache:/app/cache
      - ${APPDATA_PATH}/jellyfin-iptv/xtream2jellyfin/media:/app/media

  # ==========================================
  # SERVIDOR: JELLYFIN
  # ==========================================
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    depends_on:
      - xtream2jellyfin
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    ports:
      - "8096:8096"
    volumes:
      - ${APPDATA_PATH}/jellyfin-iptv/jellyfin/config:/config
      - ${APPDATA_PATH}/jellyfin-iptv/jellyfin/cache:/cache
      # Mapeos directos e independientes por biblioteca
      - ${APPDATA_PATH}/jellyfin-iptv/xtream2jellyfin/media/tigresTV/movies:/media/movies:ro
      - ${APPDATA_PATH}/jellyfin-iptv/xtream2jellyfin/media/tigresTV/series:/media/series:ro
    tmpfs:
      - /transcode:size=2G,uid=${PUID},gid=${PGID}
    devices:
      - /dev/dri:/dev/dri