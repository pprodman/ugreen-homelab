services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    hostname: ugreen-nas
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      # Ajusta esta ruta a tu carpeta real de Docker en el NAS Ugreen:
      - ${APPDATA_PATH}/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      # Obliga a usar el kernel de Linux para máxima velocidad:
      - TS_USERSPACE=false
      # 1. Anuncia que es Exit Node
      # 2. --accept-dns=false evita que Tailscale toque los DNS internos de tu NAS
      - TS_EXTRA_ARGS=--advertise-exit-node --accept-dns=false --reset
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE}"
        max-file: "${LOG_MAX_FILE}"