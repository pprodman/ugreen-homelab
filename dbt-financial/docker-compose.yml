services:

  dbt-runner:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: dbt-runner

    working_dir: /workspace

    volumes:
      - ./project:/workspace

    environment:
      TZ: ${TZ}

      DBT_PROFILES_DIR: /workspace

      DBT_HOST: postgres
      DBT_PORT: 5432
      DBT_DATABASE: ${DB_POSTGRES_SYSTEM_DB:-dwh_financial}
      DBT_USER: ${DB_POSTGRES_SYSTEM_USER}
      DBT_PASSWORD: ${DB_POSTGRES_SYSTEM_PASSWORD}

    networks:
      - bearslions_network

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


networks:
  bearslions_network:
    external: true