services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - GENERIC_TIMEZONE=${TZ}
      - N8N_HOST=${N8N_HOST}
      - N8N_PROTOCOL=https
      - N8N_TRUST_PROXY=true
      - N8N_PROXY_HOPS=2
      - NODE_ENV=production
      - N8N_WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # --- Gestión de Memoria (Evita el fallo Out of Memory) ---
      - NODE_OPTIONS=--max-old-space-size=1536
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem

      # --- Limpieza automática de ejecuciones ---
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336        # horas = 14 días
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all # o "none" si no necesitas auditar runs exitosos

      # --- Privacidad / rendimiento ---
      - N8N_DIAGNOSTICS_ENABLED=false

      # --- Timeout de ejecución ---
      - N8N_RUNNERS_TASK_TIMEOUT=60

    volumes:
      - ${APPDATA_PATH}/n8n:/home/node/.n8n
    ports:
      - "5678:5678"
    deploy:
      resources:
        limits:
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE}"
        max-file: "${LOG_MAX_FILE}"
    networks:
      - bearslions_network

networks:
  bearslions_network:
    external: true