name: hawser

services:
  hawser:
    image: ghcr.io/finsys/hawser:latest
    container_name: hawser
    restart: always
    environment:
      - DOCKHAND_SERVER_URL=wss://dockhand.bearslions.com/api/hawser/connect
      - TOKEN=${HAWSER_TOKEN}
      - AGENT_NAME=vps-pangolin
      - LOG_LEVEL=info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - homelab-net

networks:
  homelab-net:
    external: true