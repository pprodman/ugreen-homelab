services:
  couchdb:
    container_name: obsidian_sync_db
    image: couchdb:3.3.3
    restart: unless-stopped
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_PATH}/obsidian-sync/data:/opt/couchdb/data
      - ${APPDATA_PATH}/obsidian-sync/config:/opt/couchdb/etc/local.d
    ports:
      - "5984:5984"
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "${LOG_MAX_SIZE}"
        max-file: "${LOG_MAX_FILE}"
    networks:
      - bearslions_network

networks:
  bearslions_network:
    external: true